---
name: libvirt
on:
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  libvirt:
    name: libvirt
    runs-on: libvirt
    strategy:
      matrix:
        scenario:
          - update
        image:
          - https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
    steps:
      - name: Run molecule test
        uses: pokerops/ansible-utils@master
        with:
          run: >
            just
            --set MOLECULE_KVM_IMAGE ${{ matrix.image }}
            --set MOLECULE_SCENARIO ${{ matrix.scenario }}
            requirements test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
