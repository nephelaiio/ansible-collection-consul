---
name: molecule
on:
  pull_request:
    branches:
      - master
jobs:
  molecule:
    name: molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario:
          - binary
          - repo
        image:
          - ubuntu2404
          - ubuntu2204
          - debian12
    steps:
      - name: Run molecule test
        uses: pokerops/ansible-utils@master
        with:
          run: >
            just
            --set MOLECULE_DOCKER_IMAGE ${{ matrix.image }}
            --set MOLECULE_SCENARIO ${{ matrix.scenario }}
            requirements test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
